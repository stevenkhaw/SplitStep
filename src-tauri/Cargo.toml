[package]
name = "splitstep-app"
version = "0.4.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
libc = "0.2"

[profile.release]
# The bundle is already a gigabyte of Python. The Rust half should not add
# to it.
opt-level = "s"
lto = true
strip = true
