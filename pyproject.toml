[project]
name = "splitstep"
version = "0.2.0"
requires-python = "==3.12.*"
# AGPL-3.0 is inherited, not chosen: Ultralytics YOLO11 is AGPL-3.0 and the
# frozen sidecar links it into the shipped .dmg, so nothing weaker would state
# the obligation a recipient actually has. FFmpeg (GPL) is invoked as a
# separate process, which is why it is a note in LICENSE-THIRD-PARTY.md rather
# than the reason for this line.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "scipy>=1.14",
    "ultralytics>=8.3",
    "opencv-python-headless>=4.10",
    "watchdog>=5.0",
    "platformdirs>=4.0",
    "python-multipart>=0.0.9",
    # Load-bearing directly (media/numbered.py renders the overlay PNG), not
    # just transitively via ultralytics -- the server fails to import without it.
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[project.scripts]
splitstep = "splitstep.cli:main"

[build-system]
# >=77 for PEP 639 (`license` as an SPDX string + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Name the package instead of letting setuptools guess. Flat-layout
# auto-discovery treats every top-level directory as a package candidate, so it
# sees `web/` and the stray root `node_modules/` alongside `splitstep/` and
# refuses to build rather than pick one. This is not a consequence of the
# rename -- the candidate set is the same whatever the package is called. It
# only surfaced now because the editable install predated both directories and
# nothing had reinstalled since.
[tool.setuptools.packages.find]
include = ["splitstep*"]

# The migrations and the overlay font are read at runtime by path, so they
# have to travel with the package, not just with the source tree.
[tool.setuptools.package-data]
splitstep = ["db/migrations/*.sql", "assets/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # starlette.testclient prefers an httpx2 package that we do not install
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
